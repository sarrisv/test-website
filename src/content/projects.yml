- id: "mbdd"
  link: true
  title: "MBDD: Middleware for web-based multicast data dissemination"
  shortTitle: "MBDD"
  shortDesc: "Current unicast pull methods of data dissemination and do not scale well. For example, CNN's online network experienced nearly 10 times more traffic on the day of September 11, than it had the day before."
  description: |
    Current unicast pull methods of data dissemination and do not scale well. For example, CNN's online network experienced nearly 10 times more traffic on the day of September 11, than it had the day before. In order to meet this surge of demand, CNN had to drastically simplify their web pages. Multicast communication has been proposed as a solution to this scalability problem. However, no software solution currently exists that integrates the latest research in data management within a web based framework.

    We have developed a software distribution that integrates multicast data dissemination into a web based framework. Our middleware consists of client and server side modules. The server side provides a web server that is capable of disseminating data by multicast.
