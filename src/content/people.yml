# Faculty Members
- id: "panos-chrysanthis"
  fullname: "Panos K. Chrysanthis"
  shortname: "Panos Chrysanthis"
  roles: ["faculty"]
  department: "Lab Founder and co-Director"
  image: "../assets/people/panos.jpg"
  biography: |
    Panos Kypros Chrysanthis is a Professor of Computer Science and a founder and director of the Advanced Data Management Technologies Laboratory at the University of Pittsburgh. He is also an adjunct Professor at Carnegie-Mellon University and at the University of Cyprus. He received his BS degree (Physics with concentration in Computer Science, 1982) from the University of Athens, Greece. He earned his MS and PhD degrees (Computer and Information Sciences, 1986 and 1991) from the University of Massachusetts at Amherst. 

    His research interests lie within the areas of data management (Big Data, Databases, Data Streams & Sensor networks), distributed & mobile computing, workflow management, operating systems and real-time systems. In 1995, he was a recipient of the U.S. National Science Foundation CAREER Award for his investigation on the management of data for mobile and wireless computing. His editorial service includes VLDB J (2001 - 2007), IEEE TKDE (2012 - 2017) and DAPD (2011 - present). Chrysanthis is an ACM Distinguished Scientist and a Senior Member of IEEE. He was honored with seven teaching awards and in 2015, he received the University of Pittsburgh's Provost Award for Excellence in Mentoring (doctoral students).

    More information about Dr. Chrysanthis can be found [here](https://panos.cs.pitt.edu).

- id: "alexandros-labrinidis"
  fullname: "Alexandros Labrinidis"
  shortname: "Alexandros Labrinidis"
  roles: ["faculty"]
  department: "Lab co-Director"
  image: "../assets/people/alex_labrinidis.jpg"
  biography: |
    Dr. Alexandros Labrinidis received his Ph.D degree in Computer Science from the University of Maryland, College Park in 2002. He is currently a professor of Computer Science at the University of Pittsburgh and co-director of the Advanced Data Management Technologies Laboratory (ADMT Lab). He also previously served as the Chair at the Department of Computer Science and is an adjunct professor at Carnegie Mellon University (CS Dept).

    Dr. Labrinidis' research focuses on user-centric data management for scalable network-centric applications, including web-databases, data stream management systems, sensor networks, and scientific data management (with an emphasis on big data). He has published over 70 papers at peer-reviewed journals, conferences, and workshops; he is the recipient of an NSF CAREER award in 2008. Dr. Labrinidis served as the Secretary/Treasurer for ACM SIGMOD and as the Editor of SIGMOD Record. He is currently on the editorial board of the Very Large Databases Journal and of the Parallel and Distributed Databases Journal. He has also served on numerous program committees of international conferences/workshops; in 2014, he was the PC Track-Chair for Streams and Sensor Networks for the ICDE conference.

    More information about Dr. Labrinidis can be found [here](https://labrinidis.cs.pitt.edu/).

- id: "nadine-von-frankenberg"
  fullname: "Nadine von Frankenberg"
  shortname: "Nadine von Frankenberg"
  roles: ["collaborator"]
  department: "Computer Science"
  image: "../assets/people/Nadine-von-frankenberg.jpg"
  biography: |
    Nadine's specific research interests lie within ubiquitous computing, smart buildings, IEQ, human-in-the-loop control, digital health, and educational research. Nadine has published many representative publications within these areas and a full list can be found [here](https://www.cs.pitt.edu/people/full-time-faculty/nadine-von-frankenberg).

- id: "michael-colaresi"
  fullname: "Michael Colaresi"
  shortname: "Michael Colaresi"
  roles: ["collaborator"]
  department: "Political Science"
  image: "../assets/people/michael-colaresi.webp"
  biography: |
    Michael Colaresi is the William S. Dietrich II Chair of Political Science. His work leverages the accelerating availability of computational tools, including machine learning and Bayesian approaches, along with unstructured information, such as from digitized text, to build and improve models of national security secrecy and oversight, international and intrastate violence, and changes in human rights over time. He also develops computational and visual tools that enable domain specialists to work alongside computer scientists to improve specific applications.

    More information about Dr. Colaresi can be found [here](https://www.polisci.pitt.edu/people/michael-colaresi).

- id: "konstantinos-pelechrinis"
  fullname: "Konstantinos Pelechrinis"
  shortname: "Konstantinos Pelechrinis"
  roles: ["collaborator"]
  department: "Informatics & Network Sciences"
  image: "../assets/people/konstantios_pelechrinis.jpg"
  biography: |
    Konstantinos Pelechrinis is an associate professor in the Department of Informatics and Networked Systems at the University of Pittsburgh. He holds a PhD degree in Computer Science from the University of California, Riverside. 

    His research interests span network and data science with applications in urban sciences and sports analytics. He is a recipient of the Army Research Office Young Investigator Award.

    More information about Dr. Pelechrinis can be found [here](https://www.dins.pitt.edu/people/konstantinos-pelechrinis).

- id: "vladimir-zadorozhny"
  fullname: "Vladimir Zadorozhny"
  shortname: "Vladimir Zadorozhny"
  roles: ["collaborator"]
  department: "Informatics & Network Sciences"
  image: "../assets/people/vladimir_zadorozhny.jpg"
  biography: |
    Vladimir Zadorozhny is a Professor in the Department of Informatics and Networked Systems, a Core Faculty Member at the University of Pittsburgh's Biomedical Informatics Training Program and an Adjunct Professor in the Faculty of Engineering and Science of the University of Agder.

    He received his Ph.D. in 1993 from the Institute for Problems of Informatics, Russian Academy of Sciences in Moscow. Before coming to the USA he was a Principal Research Scientist in the Institute of System Programming, Russian Academy of Sciences. Since 1998 he worked as a Research Associate in the University of Maryland's Institute for Advanced Computer Studies at College Park. He joined the University of Pittsburgh in 2001. 

    His research interests include information integration, data fusion, complex adaptive systems and crowdsourcing, query optimization in resource-constrained distributed environments, sensor data management, and scalable architectures for wide-area environments with heterogeneous information servers. His research has been supported by NSF, EU and Norwegian Research Council. 

    More information about Dr. Zadorozhny can be found [here](https://sites.pitt.edu/~viz/).

- id: "alexander-jones"
