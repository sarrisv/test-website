- id: "constantinos-costa"
  fullname: "Constantinos Costa"
  shortname: "Constantinos Costa"
  roles: ["affiliated"]
  department: "Rinnoco Ltd, Cyprus"
  image: "../assets/people/constantinoscosta.jpg"
  biography: |
    Dr. Constantinos Costa is a co-founder and CEO of Rinnoco Ltd, a research, innovation, and education consulting startup company founded in 2021. He was a visiting assistant professor at the University of Cyprus for the Fall 2023 term. Before founding Rinnoco, he was a visiting research assistant professor at the University of Pittsburgh and a research associate in the ADMT laboratory. He has significant experience in data management (databases, spatial big data, spatio-temporal datasets, NoSQL), distributed, cloud and high-performance computing. Over the last ten years, he has developed novel software stacks and services for industrial projects in collaboration with various companies and organizations, namely, Appcampus (Finland), Cywee (Taiwan), MTN Telco (Cyprus), Geomatics (Cyprus), and Nicosia General Hospital (Cyprus). He has also contributed extensively to the open-source project Anyplace, for indoor navigation and localization, which led to new collaborations with the industry.

    More information about Dr. Costa can be found [here](https://costadb.com/).

- id: "walter-schneider"
  fullname: "Walter Schneider"
  shortname: "Walter Schneider"
  roles: ["former"]
  department: "Psychology"
  image: "../assets/people/walter.jpg"
  biography: |
    Walter Schneider is a Professor in the Department of Psychology at the University of Pittsburgh, an Executive Committee Member at the Center for the Neural Basis of Cognition and a Senior Scientist in the Learning Research & Development Center at the University of Pittsburgh. His research interests include cognitive neuroscience, cognitive control, semantic representation, attention and automaticity, skill acquisition, connectionist/hybrid modeling, brain imaging and brain activity interpretation.

    More information about Dr. Schneider can be found [here](https://www.lrdc.pitt.edu/people/researcher-detail.cshtml?id=42).

