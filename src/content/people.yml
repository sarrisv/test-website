  image: "../assets/people/alexjones.jpg"
  biography: |
    Alex K. Jones is a Full Professor of Electrical and Computer Engineering at the University of Pittsburgh. He is currently on leave from Pitt serving as the Deputyh Division Director of the Electrical, Communications and Cyber Systems (ECCS) Division at the US NSF. 

    More information about Dr. Jones can be found [here](https://www.alex-k-jones.org/).

- id: "kirk-pruhs"
  fullname: "Kirk Pruhs"
  shortname: "Kirk Pruhs"
  roles: ["collaborator"]
  department: "Computer Science"
  image: "../assets/people/kirk_pruhs.jpg"
  biography: |
    Kirk Pruhs is a Professor in the Department of Computer Science at the University of Pittsburgh. Professor Pruhs received a BS degree (Mathematics and Computer Science, 1984) from Iowa State University and a PhD degree (Computer Science, 1989) from the University of Wisconsin-Madison. 
    
    Professor Pruhs' research interests are in algorithmic problems related to relational learning, energy as a computational resource, resource management, scheduling, online optimization, online scheduling, and fair allocation. He is also on the editorial boards of Journal of Scheduling, INFORMS Journal of Computing, and ACM Transactions on Algorithms. 

    More information about Professor Pruhs can be found [here](https://people.cs.pitt.edu/~kirk/).

- id: "adam-lee"
  fullname: "Adam J. Lee"
  shortname: "Adam Lee"
  roles: ["collaborator"]
  department: "Computer Science"
  image: "../assets/people/adam_lee.jpg"
  biography: |
    Adam Lee is a Professor in the Department of Computer Science and currently serving as the Vice Provost for Undergraduate Studies at the University of Pittsburgh. Dr. Lee's research interests lie at the intersection of the computer security, privacy, and distributed systems fields. He is particularly interested in the design and analysis of systems that can be used to facilitate secure interactions across multiple security domains while still preserving each individual's privacy and autonomy. His work also investigates individuals' perceptions of privacy in the context of IoT and sensor-based systems, and the design of sensing systems that balance functionality and privacy needs of users. His research has been supported by the NSF and DARPA, and he is an NSF CAREER award recipient. 

    More information about Dr. Lee can be found [here](https://www.provost.pitt.edu/people/adam-lee).

- id: "takis-benos"
  fullname: "Panayiotis (Takis) Benos"
  shortname: "Takis Benos"
  roles: ["affiliated"]
  department: "Computational & Systems Biology"
  image: "../assets/people/panayiotis_benos.jpg"
  biography: |
    Takis Benos is a William Bushnell Presidential Chaired Professor in the Department of Epidemiology at the University of Florida where he leads a lab focused on tackling important questions in systems medicine by developing and using novel machine learning algorithms. 

    More information about Dr. Benos can be found [here](https://phhp.ufl.edu/profile/benos-takis/).

- id: "christos-faloutsos"
  fullname: "Christos Faloutsos"
  shortname: "Christos Faloutsos"
  roles: ["affiliated"]
  department: "Carnegie Mellon University, USA"
  image: "../assets/people/christos_faloutos.jpg"
  biography: |
    Christos Faloutsos is a Professor at Carnegie Mellon University and an Amazon Scholar. He is the recipient of the Fredkin Professorship in Artificial Intelligence (2020); he has received the Presidential Young Investigator Award by the National Science Foundation (1989), the Research Contributions Award in ICDM 2006, the SIGKDD Innovations Award (2010), the PAKDD Distinguished Contributions Award (2018), 29 "best paper" awards (including 8 "test of time" awards), and four teaching awards. His research interests include large-scale data mining with emphasis on graphs and time sequences; anomaly detection, tensors, and fractals.

    More information about Dr. Faloutsos can be found [here](https://www.csd.cmu.edu/people/faculty/christos-faloutsos).

- id: "demetris-zeinalipour"
  fullname: "Demetris Zeinalipour"
  shortname: "Demetris Zeinalipour"
  roles: ["affiliated"]
  department: "University of Cyprus, Cyprus"
  image: "../assets/people/demetrios_zeinalipour.jpg"
  biography: |
    Demetris Zeinalipour is a Professor of Computer Science at the University of Cyprus, where he founded and directs the Data Management Systems Laboratory (DMSL). He holds a Ph.D. and M.Sc. in Computer Science and Engineering from the University of California - Riverside, CA, USA. In addition to his roles at the University of Cyprus, he has held short-term research visits at Akamai Technologies, Cambridge, MA, USA, the University of Athens, Greece as a Marie-Curie Fellow and the University of Pittsburgh, PA, USA. His primary research interests include **Data Management in Computer Systems and Networks**, particularly Mobile Sensor and Spatio-Temporal Data Management; Big Data Management in Parallel and Distributed Architectures; Network, Blockchain and Telco Data Management; Crowd, Web 2.0 and Indoor Data Management; Data Privacy Management; Data Management for Sustainability; AI and Data Management.

    More information about Dr. Zeinalipour can be found [here](https://www.cs.ucy.ac.cy/~dzeina/).

- id: "alex-delis"
  fullname: "Alex Delis"
  shortname: "Alex Delis"
  roles: ["affiliated"]
  department: "University of Athens, Greece"
  image: "../assets/people/alex_delis.png"
  biography: |
    Alex Delis is currently a Professor of Computer Systems in the Department of Informatics and Telecommunications of the University of Athens. He received his Ph.D. and M.Sc. in Computer Science from the University of Maryland in College Park, MD. He has served as a faculty member at the Queensland University of Australia and the Polytechnic Institute of New York University in Brooklyn, NY, where he previously served as an Associate Professor. His research interests included distributed systems, system architectures (client-server, multi-tier, Grid and Cloud architectures), network information systems, and software engineering.

    More information about Dr. Delis can be found [here](https://www.madgik.di.uoa.gr/people/faculty/adelis).

